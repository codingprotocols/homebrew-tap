name: CI

# The podscape release workflow pushes here unattended, so this is the only
# gate between a bad checksum/URL and a broken `brew install` for users.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-latest is arm64. Intel is deliberately not a matrix leg: the
    # macos-13 runner queues for tens of minutes and is deprecated. The intel
    # sha256 comes from GitHub's own per-asset digest, and the intel URL is
    # checked below, so the untested part is only "does the x64 dmg mount".
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # `brew tap <name> <path>` fails here with a remote mismatch, because
      # setup-homebrew has already registered the tap. Point the tap directory
      # at this checkout with a symlink — a plain directory breaks the action's
      # post-job cleanup, which runs `rm` (not `rm -rf`) on this path.
      - name: Link tap to this checkout
        run: |
          TAPDIR="$(brew --repository)/Library/Taps/codingprotocols/homebrew-tap"
          mkdir -p "$(dirname "$TAPDIR")"
          rm -rf "$TAPDIR"
          ln -s "$GITHUB_WORKSPACE" "$TAPDIR"
          brew tap  # list, to confirm it is registered

      - name: Verify podscape dmg URLs resolve
        run: |
          version=$(grep -m1 -o 'version "[^"]*"' Casks/podscape.rb | cut -d'"' -f2)
          base="https://github.com/codingprotocols/podscape/releases/download/v${version}"
          for f in "Podscape-${version}-arm64.dmg" "Podscape-${version}.dmg"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 300 "$base/$f")
            echo "$code  $f"
            [ "$code" = "200" ] || { echo "::error::$f did not resolve (HTTP $code)"; exit 1; }
          done

      # Pint ships a single universal dmg, so there is only one URL to check.
      # Its cask is hand-maintained, which makes a stale version or checksum
      # here more likely than for the generated podscape files.
      - name: Verify pint dmg URL resolves
        run: |
          version=$(grep -m1 -o 'version "[^"]*"' Casks/pint.rb | cut -d'"' -f2)
          url="https://github.com/codingprotocols/Pint/releases/download/v${version}/Pint-${version}.dmg"
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 300 "$url")
          echo "$code  $url"
          [ "$code" = "200" ] || { echo "::error::Pint-${version}.dmg did not resolve (HTTP $code)"; exit 1; }

      - name: Audit formula
        run: brew audit --strict --online codingprotocols/tap/podscape-mcp

      - name: Audit casks
        run: |
          brew audit --strict --online --cask codingprotocols/tap/podscape
          brew audit --strict --online --cask codingprotocols/tap/pint

      - name: Install and test formula
        run: |
          brew install codingprotocols/tap/podscape-mcp
          podscape-mcp --help | grep -q "Podscape MCP Server"
          brew test codingprotocols/tap/podscape-mcp

      - name: Install casks
        run: |
          brew install --cask codingprotocols/tap/podscape
          test -d "/Applications/Podscape.app" || {
            echo "::error::Podscape.app was not installed"; exit 1; }

          # macos-latest is macOS 26, which satisfies pint's `depends_on
          # macos: :tahoe`. If that label ever moves back to an older image,
          # this step fails loudly rather than silently skipping the cask.
          brew install --cask codingprotocols/tap/pint
          test -d "/Applications/Pint.app" || {
            echo "::error::Pint.app was not installed"; exit 1; }

      - name: Verify installed apps are signed and notarized
        run: |
          for app in "/Applications/Podscape.app" "/Applications/Pint.app"; do
            echo "== $app"
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute "$app"
          done
